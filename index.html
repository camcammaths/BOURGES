&lt;script&gt;
const T=[[69,&#x27;diamants&#x27;,&#x27;#0EA5E9&#x27;],[1150,&#x27;perles&#x27;,&#x27;#8B8FA3&#x27;],[4140,&#x27;pièces d’or&#x27;,&#x27;#C98A00&#x27;]];
const NM=23,PER=T.map(([n])=&gt;n/NM);
const fmt=n=&gt;n.toLocaleString(&#x27;fr-FR&#x27;).replace(/ | /g,&#x27; &#x27;);
function primes(n){const r=[];let m=n;const o=[2,5,3];for(let q=7;q&lt;=n;q+=2)o.push(q);for(const p of o){while(m%p===0){r.push(p);m/=p}if(m===1)break}return r}
function ladder(n,fresh){const F=primes(n);let m=n,h=&#x27;&#x27;;F.forEach(p=&gt;{h+=`&lt;span class=&quot;a&quot;&gt;${fmt(m)}&lt;/span&gt;&lt;span class=&quot;p&quot;&gt;${p}&lt;/span&gt;`;m/=p});h+=`&lt;span class=&quot;a one&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;p&quot;&gt;&lt;/span&gt;`;return `&lt;div class=&quot;lwrap${fresh?&#x27; new&#x27;:&#x27;&#x27;}&quot;&gt;&lt;span class=&quot;lt&quot;&gt;décomposition de ${fmt(n)}&lt;/span&gt;&lt;div class=&quot;ladder&quot;&gt;${h}&lt;/div&gt;&lt;/div&gt;`}
const $=id=&gt;document.getElementById(id);
const K_LAD=1,K_PROD=4,K_CIRC=5,K_RES=6,K_SAIL=7,K_GO=8,MAXK=8;
let cur=-1,k=0,anim=null,prog=0,done=false;
const cv=$(&#x27;cv&#x27;),ctx=cv.getContext(&#x27;2d&#x27;);let W=0,H=0,items=[],sailors=[];

/* ---------- drawing ---------- */
function drawItem(type,x,y,s,a=1){ctx.globalAlpha=a;
  if(type===0){ctx.fillStyle=&#x27;#38BDF8&#x27;;ctx.beginPath();ctx.moveTo(x,y-s);ctx.lineTo(x+s*.75,y);ctx.lineTo(x,y+s);ctx.lineTo(x-s*.75,y);ctx.closePath();ctx.fill();ctx.fillStyle=&#x27;#BAE6FD&#x27;;ctx.beginPath();ctx.moveTo(x,y-s);ctx.lineTo(x+s*.3,y-s*.1);ctx.lineTo(x,y);ctx.closePath();ctx.fill()}
  else if(type===1){ctx.fillStyle=&#x27;#F8FAFC&#x27;;ctx.strokeStyle=&#x27;#A1A7B8&#x27;;ctx.lineWidth=Math.max(.5,s*.25);ctx.beginPath();ctx.arc(x,y,s,0,7);ctx.fill();ctx.stroke()}
  else{ctx.fillStyle=&#x27;#F5B700&#x27;;ctx.strokeStyle=&#x27;#B07800&#x27;;ctx.lineWidth=Math.max(.4,s*.25);ctx.beginPath();ctx.arc(x,y,s,0,7);ctx.fill();if(s&gt;1.6)ctx.stroke()}
  ctx.globalAlpha=1}
function drawSailor(x,y,h,a){ctx.globalAlpha=a;const u=h/40;
  ctx.fillStyle=&#x27;#1E3A8A&#x27;;ctx.fillRect(x-5*u,y+26*u,4*u,13*u);ctx.fillRect(x+1*u,y+26*u,4*u,13*u);
  ctx.fillStyle=&#x27;#FFFFFF&#x27;;ctx.strokeStyle=&#x27;#1E3A8A&#x27;;ctx.lineWidth=u;ctx.beginPath();ctx.roundRect(x-7*u,y+12*u,14*u,15*u,3*u);ctx.fill();ctx.stroke();
  ctx.fillStyle=&#x27;#1E3A8A&#x27;;for(let i=0;i&lt;3;i++)ctx.fillRect(x-7*u,y+(15+i*4)*u,14*u,1.6*u);
  ctx.fillStyle=&#x27;#F2C7A5&#x27;;ctx.beginPath();ctx.arc(x,y+7*u,5*u,0,7);ctx.fill();
  ctx.fillStyle=&#x27;#FFFFFF&#x27;;ctx.strokeStyle=&#x27;#1E3A8A&#x27;;ctx.beginPath();ctx.ellipse(x,y+2.6*u,6.5*u,2.2*u,0,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle=&#x27;#1E3A8A&#x27;;ctx.fillRect(x-4.5*u,y+3.4*u,9*u,1.4*u);ctx.globalAlpha=1}

/* ---------- layout ---------- */
const SP=[15,7,4.6],SZ=[5.5,2.6,1.9];
function layTreasure(x0,y0,w,h){ // returns positions per type, and labels
  const lw=Math.min(130,w*.18),wr=w-lw-10,G=h&lt;220?6:16,MH=h&lt;220?30:0;let s=2.2,rows;
  for(;s&gt;.25;s-=.03){let tot=0;rows=T.map(([n],t)=&gt;{const sp=SP[t]*s,per=Math.max(1,Math.floor(wr/sp)),ln=Math.ceil(n/per);return{sp,per,ln,ih:ln*sp,hh:Math.max(MH,ln*sp)}});tot=rows.reduce((a,r)=&gt;a+r.hh,0)+G*(rows.length-1);if(tot&lt;=h)break}
  const tot=rows.reduce((a,r)=&gt;a+r.hh,0)+G*2;let y=y0+(h-tot)/2;const pos=[],lab=[];
  rows.forEach((r,t)=&gt;{const p=[];for(let i=0;i&lt;T[t][0];i++)p.push([x0+lw+10+r.sp/2+(i%r.per)*r.sp,y+(r.hh-r.ih)/2+r.sp/2+Math.floor(i/r.per)*r.sp]);pos.push({p,s:SZ[t]*s});lab.push([x0+lw,y+r.hh/2]);y+=r.hh+G});
  TL_small=h&lt;220;
  return{pos,lab,s}}
function laySailors(x0,y0,w,h){
  const cols=w&gt;760?12:w&gt;520?8:6,rws=Math.ceil(NM/cols),cw=w/cols,ch=h/rws,out=[];
  const hs=Math.min(46,ch*.32),ph=ch-hs-10;let s=1.6,g;
  for(;s&gt;.2;s-=.02){const cfg=[0,1,2].map(t=&gt;{const sp=SP[t]*s*.62,per=Math.max(1,Math.floor((cw-10)/sp));return{sp,per,ln:Math.ceil(PER[t]/per)}});const tt=cfg.reduce((a,c)=&gt;a+c.ln*c.sp,0)+8;if(tt&lt;=ph){g=cfg;break}}
  if(!g)g=[0,1,2].map(t=&gt;({sp:SP[t]*.2,per:Math.floor((cw-10)/(SP[t]*.2)),ln:1}));
  for(let i=0;i&lt;NM;i++){const r=Math.floor(i/cols),c=i%cols,inRow=Math.min(cols,NM-r*cols),off=(cols-inRow)*cw/2;const cx=x0+off+c*cw+cw/2,cy=y0+r*ch;
    const slots=[];let yy=cy+hs+8;g.forEach((cf,t)=&gt;{const rowW=Math.min(PER[t],cf.per)*cf.sp,p=[];for(let m=0;m&lt;PER[t];m++)p.push([cx-rowW/2+cf.sp/2+(m%cf.per)*cf.sp,yy+cf.sp/2+Math.floor(m/cf.per)*cf.sp]);slots.push(p);yy+=cf.ln*cf.sp+4});
    out.push({x:cx,y:cy,h:hs,slots,s:s*.62})}
  return out}

function size(){const r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;W=r.width;
  H=k===0?Math.max(220,innerHeight-330):k&lt;K_SAIL?Math.max(60,Math.min(150,innerHeight-(k&gt;=K_RES?610:570))):Math.max(260,innerHeight-300-(done?40:0));
  cv.style.height=H+&#x27;px&#x27;;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
let TL,SL,TL_small=false;
function layout(){if(k&lt;K_SAIL){TL=layTreasure(0,0,W,H);SL=null}else{const ht=Math.max(90,H*.3);TL=layTreasure(0,0,W,ht);SL=laySailors(0,ht+10,W,H-ht-10)}}
const ease=t=&gt;t&lt;.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function paint(now){ctx.clearRect(0,0,W,H);
  ctx.textAlign=&#x27;right&#x27;;ctx.textBaseline=&#x27;middle&#x27;;
  TL.lab.forEach(([x,y],t)=&gt;{ctx.fillStyle=T[t][2];const sm=TL_small;ctx.font=`800 ${sm?16:26}px Inter, sans-serif`;ctx.fillText(fmt(T[t][0]),x,y-(sm?6:8));ctx.font=`700 ${sm?10:14}px Inter, sans-serif`;ctx.fillText(T[t][1],x,y+(sm?8:12))});
  const tt=anim?(now-anim.t0):0;
  if(SL){SL.forEach((sl,i)=&gt;drawSailor(sl.x,sl.y,sl.h,1))}
  TL.pos.forEach((P,t)=&gt;P.p.forEach(([x,y],j)=&gt;{
    if(!SL||(!anim&amp;&amp;!done)){drawItem(t,x,y,P.s);return}
    const i=Math.floor(j/PER[t]),m=j%PER[t],[tx,ty]=SL[i].slots[t][m];
    const d=i*anim.D+t*120+(m%20)*6;let q=done?1:Math.min(1,Math.max(0,(tt-d)/850));
    if(q&lt;=0){drawItem(t,x,y,P.s);return}
    const e=ease(q),xx=x+(tx-x)*e,yy=y+(ty-y)*e-Math.sin(Math.PI*e)*40,ss=P.s+(SL[i].s*SZ[t]-P.s)*e;drawItem(t,xx,yy,ss)}));
  if(anim&amp;&amp;!done){if(tt&lt;anim.end)requestAnimationFrame(paint);else{done=true;anim=null;showRes()}}}
function showRes(){const r=$(&#x27;res&#x27;);r.className=&#x27;res new&#x27;;r.innerHTML=`chaque marin : &lt;span class=&quot;d1&quot;&gt;3&lt;/span&gt; diamants, &lt;span class=&quot;d2&quot;&gt;50&lt;/span&gt; perles et &lt;span class=&quot;d3&quot;&gt;180&lt;/span&gt; pièces d’or`}

/* ---------- steps ---------- */
function render(fresh){
  const cv0=cur&lt;0;$(&#x27;cover&#x27;).hidden=!cv0;$(&#x27;stage&#x27;).hidden=cv0;$(&#x27;step&#x27;).hidden=cv0;$(&#x27;prev&#x27;).disabled=cv0;$(&#x27;next&#x27;).disabled=!cv0;
  if(cv0){$(&#x27;cue&#x27;).textContent=&#x27;« Rappel : que doit vérifier un partage équitable ? »&#x27;;return}
  anim=null;if(!(fresh&amp;&amp;k===K_GO))done=k&gt;=K_GO&amp;&amp;!fresh?true:done;if(k&lt;K_GO)done=false;
  const ns=T.map(x=&gt;x[0]),L=ns.map(primes);
  $(&#x27;ladrow&#x27;).innerHTML=k&gt;=K_LAD&amp;&amp;k&lt;K_SAIL?ns.map((n,j)=&gt;`&lt;div class=&quot;lad&quot;&gt;${k&gt;=K_LAD+j?ladder(n,fresh&amp;&amp;k===K_LAD+j):&#x27;&#x27;}&lt;/div&gt;`).join(&#x27;&#x27;):&#x27;&#x27;;
  $(&#x27;lines&#x27;).innerHTML=k&gt;=K_PROD&amp;&amp;k&lt;K_SAIL?ns.map((n,j)=&gt;`&lt;span class=&quot;${fresh&amp;&amp;k===K_PROD?&#x27;new&#x27;:&#x27;&#x27;}&quot;&gt;${fmt(n)} = ${L[j].map(p=&gt;`&lt;span class=&quot;f${p===23&amp;&amp;k&gt;=K_CIRC?&#x27; c&#x27;+(fresh&amp;&amp;k===K_CIRC?&#x27; pop&#x27;:&#x27;&#x27;):&#x27;&#x27;}&quot;&gt;${p}&lt;/span&gt;`).join(&#x27;&lt;span class=&quot;x&quot;&gt;×&lt;/span&gt;&#x27;)}&lt;/span&gt;`).join(&#x27;&#x27;):&#x27;&#x27;;
  const r=$(&#x27;res&#x27;);r.className=&#x27;res&#x27;+(fresh?&#x27; new&#x27;:&#x27;&#x27;);
  r.innerHTML=k&gt;=K_RES&amp;&amp;k&lt;K_SAIL?&#x27;Le seul diviseur commun autre que 1 est &lt;b&gt;23&lt;/b&gt; : il y a &lt;b&gt;23&lt;/b&gt; marins.&#x27;:&#x27;&#x27;;
  if(k&gt;=K_GO&amp;&amp;done)showRes();
  size();layout();
  if(fresh&amp;&amp;k===K_GO&amp;&amp;!matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches){done=false;const D=Math.min(160,3500/NM);anim={t0:performance.now()+200,D,end:200+(NM-1)*D+240+20*6+900};requestAnimationFrame(paint)}
  else{if(k===K_GO)done=true;paint(performance.now());if(k===K_GO)showRes()}
  $(&#x27;step&#x27;).disabled=k&gt;=MAXK;
  $(&#x27;cue&#x27;).textContent=k===0?&#x27;« 69 diamants, 1 150 perles et 4 140 pièces d’or : tout est distribué, chaque marin reçoit la même part. »&#x27;
    :k&lt;K_PROD?`« On décompose ${fmt(ns[k-1])} en facteurs premiers. »`
    :k===K_PROD?&#x27;« On écrit chaque nombre comme un produit de facteurs premiers. »&#x27;
    :k===K_CIRC?&#x27;« 23 est le seul facteur commun aux trois nombres : on l’entoure. »&#x27;
    :k===K_RES?&#x27;« Le nombre de marins divise 69, 1 150 et 4 140. »&#x27;
    :k===K_SAIL?&#x27;« Voici les 23 marins. On partage le trésor ? »&#x27;
    :&#x27;« 69 ÷ 23 = 3 · 1 150 ÷ 23 = 50 · 4 140 ÷ 23 = 180 »&#x27;;
}
$(&#x27;step&#x27;).onclick=()=&gt;{if(k&lt;MAXK){k++;render(true)}};
$(&#x27;next&#x27;).onclick=()=&gt;{if(cur&lt;0){cur=0;k=0;render(false)}};
$(&#x27;prev&#x27;).onclick=()=&gt;{if(cur===0){if(k&gt;0){k=0;render(false)}else{cur=-1;render(false)}}};
cv.onclick=()=&gt;{if(k===K_SAIL)$(&#x27;step&#x27;).click()};
document.addEventListener(&#x27;keydown&#x27;,e=&gt;{if(e.key===&#x27;ArrowRight&#x27;)$(&#x27;next&#x27;).click();if(e.key===&#x27;ArrowLeft&#x27;)$(&#x27;prev&#x27;).click();if((e.key===&#x27; &#x27;||e.key===&#x27;Enter&#x27;)&amp;&amp;cur&gt;=0){e.preventDefault();$(&#x27;step&#x27;).click()}});
let rz;addEventListener(&#x27;resize&#x27;,()=&gt;{clearTimeout(rz);rz=setTimeout(()=&gt;{if(cur&gt;=0&amp;&amp;!anim){size();layout();paint(performance.now())}},120)});
(document.fonts&amp;&amp;document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=&gt;{if(cur&gt;=0&amp;&amp;!anim){paint(performance.now())}});
render(false);
&lt;/script&gt;

.schema{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:980px}
.schema:empty{display:none}
#boxes{flex-basis:100%;gap:8px}
#boxes.wait .box{cursor:pointer}#boxes.wait .box:hover{border-color:var(--accent)}
.box{display:grid;gap:1px;align-items:end;justify-content:center;padding:5px 7px;border:2px dashed var(--line);border-radius:12px;background:#fff}
.box .ic.fl{width:100%;height:auto;visibility:hidden}.box .ic.fl.in{visibility:visible}
.sic .ic.gone{visibility:hidden}
.conc{flex-basis:100%;text-align:center;font-weight:800;font-size:clamp(18px,2.4vw,26px);margin-top:2px}.dv{font:inherit;color:var(--accent);background:var(--soft);border:1.5px solid var(--line);border-radius:999px;padding:0 .45em;cursor:pointer;line-height:1.3}.dv.on{background:var(--accent);border-color:var(--accent);color:#fff}
.flyer{position:fixed;left:0;top:0;pointer-events:none;z-index:50;transform-origin:0 0;will-change:transform}
.more{align-self:center;font-weight:700;color:var(--muted);font-size:18px}
.tot{flex-basis:100%;display:flex;gap:28px;justify-content:center;font-weight:700;font-size:clamp(16px,2vw,21px);margin-top:4px}
.stage.sch .ladrow,.stage.sch .lines,.stage.sch .lot{display:none}
.stock{display:flex;flex-direction:column;gap:12px;align-items:center;max-width:980px}
.stock:empty{display:none}
.srow{display:flex;gap:12px;align-items:center}
.sn{font-weight:800;font-size:30px;min-width:3.6em;text-align:right;display:flex;flex-direction:column;align-items:flex-end;line-height:1.05}
.sn small{font-size:14px;font-weight:700}
.sic{display:flex;flex-wrap:wrap;gap:2px 3px;width:min(880px,calc(100vw - 160px));align-items:flex-end}
.sic .ic.fl{width:calc(30px * var(--sc,1));height:calc(46px * var(--sc,1))}.sic .ic.candy{width:42px;height:23px}
.stage.k0 .ladrow{display:none}
.stage.three .ladrow{gap:44px;font-size:clamp(14px,1.8vw,18px)}
.stage.three .lines{font-size:clamp(16px,2vw,24px);gap:2px}
.stage.k0 .lines,.stage.k0 .res,.stage.k0 .lot{display:none}
.stock.small{gap:2px}
.stock.small .sn{font-size:18px;min-width:5.2em}.stock.small .sn small{font-size:11px}
.stock.small .sic{gap:1px 2px}
.f.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.35)}100%{transform:scale(1)}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.new{animation:none}.f{transition:none}}

   {n:&#x27;2.&#x27;,x:&#x27;On donne la décomposition en produit de facteurs premiers de 85 : 85 = 5 × 17.&#x27;,q:&#x27;Décomposer 102 en produit de facteurs premiers.&#x27;,c:[&#x27;102 = 2 × 51 = 2 × 3 × 17&#x27;,&#x27;102 = &lt;span class=&quot;ans&quot;&gt;2 × 3 × 17&lt;/span&gt;&#x27;]},
   {n:&#x27;3.&#x27;,q:&#x27;Donner 3 diviseurs non premiers du nombre 102.&#x27;,c:[&#x27;On multiplie des facteurs premiers entre eux :&#x27;,&#x27;2 × 3 = 6 · 2 × 17 = 34 · 3 × 17 = 51&#x27;,&#x27;Par exemple &lt;span class=&quot;ans&quot;&gt;6, 34 et 51&lt;/span&gt; (ou 102).&#x27;]},
   {n:&#x27;4.&#x27;,x:&#x27;Un libraire dispose d’une feuille cartonnée de 85 cm sur 102 cm. Il souhaite découper dans celle-ci, en utilisant toute la feuille, des étiquettes carrées. Les côtés de ces étiquettes ont tous la même mesure.&#x27;,q:&#x27;Les étiquettes peuvent-elles avoir 34 cm de côté ? Justifier.&#x27;,c:[&#x27;102 ÷ 34 = 3 : 34 est bien un diviseur de 102.&#x27;,&#x27;Mais 85 ÷ 34 = 2,5 : 34 n’est pas un diviseur de 85.&#x27;,&#x27;&lt;span class=&quot;ans&quot;&gt;Non&lt;/span&gt;, on ne peut pas utiliser toute la feuille.&#x27;]},

  ]},
 {h:&#x27;exercice 3&#x27;,src:&#x27;DNB juillet 2019 · Métropole&#x27;,
  ctx:[&#x27;Le capitaine d’un navire possède un trésor constitué de 69 diamants, 1 150 perles et 4 140 pièces d’or.&#x27;],

   {n:&#x27;3. a.&#x27;,x:&#x27;Un snack vend des barquettes de nems et de samossas. Le cuisinier a préparé 162 nems et 108 samossas. Dans chaque barquette, le nombre de nems doit être le même, le nombre de samossas aussi, et tout doit être utilisé.&#x27;,q:&#x27;Le cuisinier peut-il réaliser 36 barquettes ?&#x27;,c:[&#x27;108 ÷ 36 = 3, mais 162 ÷ 36 = 4,5.&#x27;,&#x27;36 ne divise pas 162 : &lt;span class=&quot;ans&quot;&gt;non&lt;/span&gt;.&#x27;]},
   {n:&#x27;3. b.&#x27;,q:&#x27;Quel nombre maximal de barquettes pourra-t-il réaliser ?&#x27;,c:[`On cherche le plus grand diviseur commun à 162 et 108 : 2 × ${X(3,3)} = 54.`,&#x27;Il pourra réaliser au maximum &lt;span class=&quot;ans&quot;&gt;54 barquettes&lt;/span&gt;.&#x27;]},

const fmt=n=&gt;n.toLocaleString(&#x27;fr-FR&#x27;).replace(/ | /g,&#x27; &#x27;);

const NUMS=[18,72,120,135,150,225,246,315,378,456,510,97,999,1024,1100,1236,1350,2025,2468,3060,3125,4096,4444,5832,6345,7290,8100,9876,12345,113];

  return ds.map((d,i)=&gt;(i?`&lt;span class=&quot;op&quot; style=&quot;--i:${i}&quot;&gt;+&lt;/span&gt;`:&#x27;&#x27;)+`&lt;span class=&quot;dg&quot;&gt;${d}&lt;/span&gt;`).join(&#x27;&#x27;)+`&lt;span class=&quot;op eq&quot; style=&quot;--i:${ds.length}&quot;&gt;=&lt;/span&gt;&lt;span class=&quot;res&quot; style=&quot;--i:${ds.length}&quot;&gt;${sm}&lt;/span&gt;`}

  for(let i=str.length-1;i&gt;=0;i--){const c=str[i];if(c===&#x27; &#x27;){out.unshift(&#x27; &#x27;);continue}

  const sum=`&lt;span class=&quot;sum&quot;&gt;${ds.map((x,i)=&gt;`&lt;span class=&quot;term&quot; style=&quot;--i:${i}&quot;&gt;${i?&#x27; + &#x27;:&#x27;&#x27;}${x}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;span class=&quot;term&quot; style=&quot;--i:${ds.length}&quot;&gt; = ${sm}&lt;/span&gt;&lt;/span&gt;`;

  if(d===10)return `&lt;b&gt;par 10 :&lt;/b&gt; se termine par ${u} ${mark(ok)}`;
  if(d===4)return `&lt;b&gt;par 4 :&lt;/b&gt; ${String(two).padStart(2,&#x27;0&#x27;)} ${two%4===0?`= 4 × ${two/4}`:&#x27;n’est pas dans la table de 4&#x27;} ${mark(ok)}`;
  return `&lt;b&gt;par ${d} :&lt;/b&gt; ${sum} ${sm%d===0?`→ ${sm} est dans la table de ${d}`:`→ ${sm} n’est pas dans la table de ${d}`} ${mark(ok)}`;

const CUE={2:&#x27;« Regardez le chiffre des unités : pair ou impair ? »&#x27;,5:&#x27;« Le chiffre des unités : 0 ou 5 ? »&#x27;,10:&#x27;« Le chiffre des unités : 0 ? »&#x27;,4:&#x27;« Les deux derniers chiffres : dans la table de 4 ? »&#x27;,3:&#x27;« On additionne les chiffres. »&#x27;,9:&#x27;« On additionne les chiffres. »&#x27;};

  if(cv){$(&#x27;cue&#x27;).textContent=&#x27;« Rappel : comment sait-on si un nombre est divisible par 2 ? par 3 ? »&#x27;;return}
  const n=NUMS[cur],R=rev[cur]||[],ld=last[cur];

  const T=$(&#x27;tiles&#x27;);T.innerHTML=&#x27;&#x27;;

    if(R.includes(d)){const ok=n%d===0;b.classList.add(ok?&#x27;ok&#x27;:&#x27;no&#x27;);b.querySelector(&#x27;.st&#x27;).textContent=ok?&#x27;✓&#x27;:&#x27;✗&#x27;;if(fresh&amp;&amp;d===ld)b.classList.add(&#x27;rev&#x27;)}
    b.onclick=()=&gt;{if(R.includes(d)){last[cur]=(last[cur]===d)?undefined:d;render(false)}else reveal(d)};
    T.appendChild(b)});
  const W=$(&#x27;why&#x27;);W.innerHTML=&#x27;&#x27;;
  $(&#x27;check&#x27;).disabled=R.length===DIVS.length;

}

$(&#x27;next&#x27;).onclick=()=&gt;{clearTimeout(auto);if(cur&lt;NUMS.length-1){cur++;render(false)}};

      &lt;circle cx=&quot;70&quot; cy=&quot;64&quot; r=&quot;5&quot; fill=&quot;#1E1B4B&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;50&quot; font-size=&quot;13&quot; font-weight=&quot;600&quot;&gt;Vierzon&lt;/text&gt;

&lt;script&gt;
const EX=[
 {kind:&#x27;une phrase de la vie courante&#x27;,H:&#x27;j’habite à Bourges&#x27;,C:&#x27;j’habite dans le Cher&#x27;,fig:&#x27;figR&#x27;,pre:[&#x27;Si&#x27;,&#x27;Si&#x27;]},
 {kind:&#x27;un autre exemple&#x27;,H:&#x27;je suis en 4e&#x27;,C:&#x27;je suis au collège&#x27;,fig:&#x27;figK&#x27;,pre:[&#x27;Si&#x27;,&#x27;Si&#x27;]},
 {kind:&#x27;avec des nombres&#x27;,H:&#x27;se termine par 2&#x27;,C:&#x27;est pair&#x27;,fig:&#x27;none&#x27;,pre:[&#x27;Si un nombre entier&#x27;,&#x27;Si un nombre entier&#x27;],mid:&#x27;alors il&#x27;},
 {kind:&#x27;encore un exemple&#x27;,H:&#x27;aujourd’hui est lundi&#x27;,C:&#x27;demain est mardi&#x27;,fig:&#x27;figL&#x27;,pre:[&#x27;Si&#x27;,&#x27;Si&#x27;]},
 {kind:&#x27;théorème de Pythagore&#x27;,kindR:&#x27;réciproque du théorème de Pythagore&#x27;,H:&#x27;ABC est un triangle rectangle en C&#x27;,C:&#x27;AB² = AC² + CB²&#x27;,fig:&#x27;figP&#x27;,pre:[&#x27;Si&#x27;,&#x27;Si&#x27;]}
];
const STEPS=[
 {e:0,s:0,cue:&#x27;« Cette phrase est-elle vraie ? »&#x27;,t:&#x27;une phrase « Si…, alors… ».&#x27;,n:&#x27;&#x27;},
 {e:0,s:1,cue:&#x27;« Ce que l’on sait au départ : c’est l’hypothèse. »&#x27;,t:&#x27;l’hypothèse.&#x27;,n:&#x27;Après « Si », on trouve l’&lt;b style=&quot;color:var(--hyp)&quot;&gt;hypothèse&lt;/b&gt; : ce que l’on sait au départ.&#x27;},
 {e:0,s:2,cue:&#x27;« Ce que l’on obtient : c’est la conclusion. »&#x27;,t:&#x27;la conclusion.&#x27;,n:&#x27;Après « alors », on trouve la &lt;b style=&quot;color:var(--ccl)&quot;&gt;conclusion&lt;/b&gt; : ce que l’on obtient.&#x27;},
 {e:0,s:3,cue:&#x27;« On échange les deux : c’est la réciproque. »&#x27;,t:&#x27;on échange !&#x27;,n:&#x27;On &lt;b&gt;échange&lt;/b&gt; l’hypothèse et la conclusion : on obtient la &lt;b&gt;réciproque&lt;/b&gt; de la phrase.&#x27;},
 {e:0,s:4,cue:&#x27;« Vraie ? Non : on peut habiter à Vierzon. »&#x27;,t:&#x27;est-elle vraie ?&#x27;,n:&#x27;Si j’habite dans le Cher, est-ce que j’habite forcément à Bourges ?&#x27;,
  note:&#x27;&lt;b&gt;Non !&lt;/b&gt; On peut habiter dans le Cher sans habiter à Bourges : à Vierzon, par exemple.&#x27;,cls:&#x27;no&#x27;},
 {e:1,s:0,cue:&#x27;« Vraie pour tous les élèves de 4e ? »&#x27;,t:&#x27;un autre exemple.&#x27;,n:&#x27;Une deuxième phrase de tous les jours.&#x27;},
 {e:1,s:1,cue:&#x27;« Qui me montre l’hypothèse ? »&#x27;,t:&#x27;l’hypothèse.&#x27;,n:&#x27;L’&lt;b style=&quot;color:var(--hyp)&quot;&gt;hypothèse&lt;/b&gt; : je suis en 4e.&#x27;},
 {e:1,s:2,cue:&#x27;« Et la conclusion ? »&#x27;,t:&#x27;la conclusion.&#x27;,n:&#x27;La &lt;b style=&quot;color:var(--ccl)&quot;&gt;conclusion&lt;/b&gt; : je suis au collège.&#x27;},
 {e:1,s:3,cue:&#x27;« Lisez la réciproque à voix haute. »&#x27;,t:&#x27;on échange !&#x27;,n:&#x27;On &lt;b&gt;échange&lt;/b&gt; l’hypothèse et la conclusion.&#x27;},
 {e:1,s:4,cue:&#x27;« Non : un élève de 6e est au collège, sans être en 4e. »&#x27;,t:&#x27;est-elle vraie ?&#x27;,n:&#x27;Si je suis au collège, est-ce que je suis forcément en 4e ?&#x27;,k6:1,
  note:&#x27;&lt;b&gt;Non !&lt;/b&gt; Un élève de 6e est au collège, mais il n’est pas en 4e.&#x27;,cls:&#x27;no&#x27;},
 {e:2,s:0,cue:&#x27;« Testez : 12, 32, 102… tous pairs ? »&#x27;,t:&#x27;avec des nombres.&#x27;,n:&#x27;&#x27;},
 {e:2,s:1,cue:&#x27;« L’hypothèse : se termine par 2. »&#x27;,t:&#x27;l’hypothèse.&#x27;,n:&#x27;&#x27;},
 {e:2,s:2,cue:&#x27;« La conclusion : est pair. »&#x27;,t:&#x27;la conclusion.&#x27;,n:&#x27;&#x27;},
 {e:2,s:3,cue:&#x27;« Voici la réciproque. Que pensez-vous ? »&#x27;,t:&#x27;on échange !&#x27;,n:&#x27;&#x27;},
 {e:2,s:4,cue:&#x27;« Non : 14 est pair, mais il se termine par 4. Un seul contre-exemple suffit. »&#x27;,t:&#x27;est-elle vraie ?&#x27;,n:&#x27;&#x27;,note:&#x27;&lt;b&gt;Non !&lt;/b&gt; 14 est pair, mais il se termine par 4.&#x27;,cls:&#x27;no&#x27;},
 {e:3,s:0,cue:&#x27;« Celle-ci est-elle vraie ? »&#x27;,t:&#x27;encore un exemple.&#x27;,n:&#x27;Une troisième phrase de tous les jours.&#x27;},
 {e:3,s:1,cue:&#x27;« L’hypothèse ? »&#x27;,t:&#x27;l’hypothèse.&#x27;,n:&#x27;L’&lt;b style=&quot;color:var(--hyp)&quot;&gt;hypothèse&lt;/b&gt; : aujourd’hui est lundi.&#x27;},
 {e:3,s:2,cue:&#x27;« La conclusion ? »&#x27;,t:&#x27;la conclusion.&#x27;,n:&#x27;La &lt;b style=&quot;color:var(--ccl)&quot;&gt;conclusion&lt;/b&gt; : demain est mardi.&#x27;},
 {e:3,s:3,cue:&#x27;« On échange… »&#x27;,t:&#x27;on échange !&#x27;,n:&#x27;On &lt;b&gt;échange&lt;/b&gt; l’hypothèse et la conclusion.&#x27;},
 {e:3,s:4,cue:&#x27;« Oui ! La veille de mardi est toujours lundi. Une réciproque peut donc être vraie : il faut vérifier. »&#x27;,t:&#x27;est-elle vraie ?&#x27;,n:&#x27;Si demain est mardi, est-ce qu’aujourd’hui est forcément lundi ?&#x27;,
  note:&#x27;&lt;b&gt;Oui !&lt;/b&gt; Le jour avant mardi est toujours lundi.&#x27;,cls:&#x27;yes&#x27;},
 {e:4,s:0,cue:&#x27;« Le théorème que vous connaissez : il sert à calculer une longueur. »&#x27;,t:&#x27;le théorème de Pythagore.&#x27;,n:&#x27;Revenons aux maths. Voici le théorème de Pythagore, lui aussi de la forme « Si…, alors… ».&#x27;},
 {e:4,s:1,cue:&#x27;« On sait que le triangle est rectangle en C. »&#x27;,t:&#x27;l’hypothèse.&#x27;,n:&#x27;L’&lt;b style=&quot;color:var(--hyp)&quot;&gt;hypothèse&lt;/b&gt; : le triangle est rectangle en C.&#x27;},
 {e:4,s:2,cue:&#x27;« On obtient l’égalité de Pythagore. »&#x27;,t:&#x27;la conclusion.&#x27;,n:&#x27;La &lt;b style=&quot;color:var(--ccl)&quot;&gt;conclusion&lt;/b&gt; : l’égalité de Pythagore.&#x27;},
 {e:4,s:3,cue:&#x27;« Même méthode : on échange. »&#x27;,t:&#x27;on échange !&#x27;,n:&#x27;Comme dans les exemples précédents, on &lt;b&gt;échange&lt;/b&gt; l’hypothèse et la conclusion.&#x27;},
 {e:4,s:4,cue:&#x27;« Elle est vraie (on l’admet) : elle sert à prouver qu’un triangle est rectangle. »&#x27;,t:&#x27;la réciproque.&#x27;,n:&#x27;On obtient la &lt;b&gt;réciproque du théorème de Pythagore&lt;/b&gt;. Cette fois, elle est &lt;b&gt;vraie&lt;/b&gt; !&#x27;,
  note:&#x27;&lt;b&gt;À quoi ça sert ?&lt;/b&gt; Le théorème permet de &lt;b&gt;calculer une longueur&lt;/b&gt; dans un triangle rectangle. La réciproque permet de &lt;b&gt;prouver qu’un triangle est rectangle&lt;/b&gt;. En 4e, on l’admet.&#x27;,cls:&#x27;&#x27;}
];
const stmt=document.getElementById(&#x27;stmt&#x27;);let cur=-1;
const blk=(id,txt,tag)=&gt;`&lt;span class=&quot;blk&quot; id=&quot;${id}&quot;&gt;&lt;span class=&quot;t&quot;&gt;${txt}&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;${tag}&lt;/span&gt;&lt;/span&gt;`;
function layout(ex,swapped){
  stmt.innerHTML=swapped
   ? `&lt;span class=&quot;w&quot;&gt;${ex.pre[1]}&lt;/span&gt;${blk(&#x27;C&#x27;,ex.C+&#x27;,&#x27;,&#x27;hypothèse&#x27;)}&lt;span class=&quot;w&quot;&gt;${ex.mid||&#x27;alors&#x27;}&lt;/span&gt;${blk(&#x27;H&#x27;,ex.H+&#x27;.&#x27;,&#x27;conclusion&#x27;)}`
   : `&lt;span class=&quot;w${ex.pre[0]===&#x27;S’&#x27;?&#x27; el&#x27;:&#x27;&#x27;}&quot;&gt;${ex.pre[0]}&lt;/span&gt;${blk(&#x27;H&#x27;,ex.H+&#x27;,&#x27;,&#x27;hypothèse&#x27;)}&lt;span class=&quot;w&quot;&gt;${ex.mid||&#x27;alors&#x27;}&lt;/span&gt;${blk(&#x27;C&#x27;,ex.C+&#x27;.&#x27;,&#x27;conclusion&#x27;)}`;
  fit();
}
const BOX=document.querySelector(&#x27;.box&#x27;);let lastW=0;
function fit(){const avail=BOX.clientWidth-52;stmt.classList.remove(&#x27;wrapit&#x27;);let f=34;stmt.style.fontSize=f+&#x27;px&#x27;;while(stmt.scrollWidth&gt;avail&amp;&amp;f&gt;16){f--;stmt.style.fontSize=f+&#x27;px&#x27;}if(stmt.scrollWidth&gt;avail){stmt.classList.add(&#x27;wrapit&#x27;);stmt.style.fontSize=&#x27;20px&#x27;}lastW=BOX.clientWidth}
addEventListener(&#x27;resize&#x27;,fit);
if(window.ResizeObserver)new ResizeObserver(()=&gt;{if(BOX.clientWidth!==lastW)fit()}).observe(BOX);
if(document.fonts)document.fonts.ready.then(fit);
function setOn(s){document.getElementById(&#x27;H&#x27;).classList.toggle(&#x27;on&#x27;,s&gt;=1);document.getElementById(&#x27;C&#x27;).classList.toggle(&#x27;on&#x27;,s&gt;=2)}
function render(i,animate){
  const cv=i&lt;0;document.getElementById(&#x27;cover&#x27;).hidden=!cv;document.getElementById(&#x27;main&#x27;).hidden=cv;document.querySelector(&#x27;.prog&#x27;).style.visibility=cv?&#x27;hidden&#x27;:&#x27;visible&#x27;;
  document.getElementById(&#x27;prev&#x27;).disabled=cv;document.getElementById(&#x27;cue&#x27;).textContent=cv?&#x27;« Qui peut me rappeler le théorème de Pythagore ? »&#x27;:STEPS[i].cue;if(cv){document.getElementById(&#x27;next&#x27;).disabled=false;return}
  const st=STEPS[i],ex=EX[st.e],s=st.s;
  document.getElementById(&#x27;ttl&#x27;).innerHTML=`&lt;span class=&quot;ex&quot;&gt;étape ${i+1}&lt;/span&gt; · ${st.t}`;document.getElementById(&#x27;narr&#x27;).innerHTML=st.n;
  document.getElementById(&#x27;count&#x27;).textContent=`${i+1} / ${STEPS.length}`;
  document.getElementById(&#x27;fill&#x27;).style.width=((i+1)/STEPS.length*100)+&#x27;%&#x27;;
  document.getElementById(&#x27;next&#x27;).disabled=i===STEPS.length-1;
  document.getElementById(&#x27;kind&#x27;).textContent=s&gt;=3?(ex.kindR||&#x27;sa réciproque&#x27;):ex.kind;
  [&#x27;figP&#x27;,&#x27;figR&#x27;,&#x27;figK&#x27;,&#x27;figL&#x27;].forEach(f=&gt;document.getElementById(f).hidden=ex.fig!==f);document.getElementById(&#x27;k6&#x27;).classList.toggle(&#x27;cx&#x27;,!!st.k6);
  const note=document.getElementById(&#x27;note&#x27;);note.hidden=!st.note;note.className=&#x27;note &#x27;+(st.cls||&#x27;&#x27;);note.innerHTML=st.note||&#x27;&#x27;;
  document.getElementById(&#x27;ra&#x27;).classList.toggle(&#x27;on&#x27;,st.e===4&amp;&amp;s&gt;=4);
  document.getElementById(&#x27;raT&#x27;).style.opacity=(st.e===4&amp;&amp;s&gt;=4)?0:1;
  if(animate&amp;&amp;s===3){
    const r0={H:document.getElementById(&#x27;H&#x27;).getBoundingClientRect(),C:document.getElementById(&#x27;C&#x27;).getBoundingClientRect()};
    layout(ex,true);setOn(s);
    const reduce=matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
    [&#x27;H&#x27;,&#x27;C&#x27;].forEach((id,k)=&gt;{const e=document.getElementById(id),r1=e.getBoundingClientRect();
      const dx=r0[id].left-r1.left,dy=r0[id].top-r1.top,arc=k===0?-70:70;
      if(!reduce)e.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:`translate(${dx/2}px,${dy/2+arc}px)`,offset:.5},{transform:&#x27;none&#x27;}],{duration:1600,easing:&#x27;ease-in-out&#x27;})});
  }else{layout(ex,s&gt;=3);setOn(s)}
}
document.getElementById(&#x27;next&#x27;).onclick=()=&gt;{if(cur&lt;STEPS.length-1){cur++;render(cur,cur&gt;=0)}};
document.getElementById(&#x27;prev&#x27;).onclick=()=&gt;{if(cur&gt;-1){cur--;render(cur,false)}};
document.addEventListener(&#x27;keydown&#x27;,e=&gt;{if(e.key===&#x27;ArrowRight&#x27;)document.getElementById(&#x27;next&#x27;).click();if(e.key===&#x27;ArrowLeft&#x27;)document.getElementById(&#x27;prev&#x27;).click()});
cur=-1;render(-1,false);
&lt;/script&gt;

<script>
const PDFS=JSON.parse(document.getElementById('pdfs').textContent);
function openPdf(k){const p=PDFS[k],bin=atob(p.b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const blob=new Blob([u],{type:'application/pdf'});
  if(window.claude&&claude.use){DL.then(d=>{if(d)d.save({filename:p.name,data:blob}).catch(()=>{});else saveLocal(blob,p.name)});return}
  saveLocal(blob,p.name)}
function saveLocal(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
const DL=(window.claude&&claude.use)?claude.use('downloads').catch(()=>null):Promise.resolve(null);
const menu=document.getElementById('menu'),bar=document.getElementById('bar');
document.querySelectorAll('.item').forEach(b=>b.onclick=()=>{if(b.dataset.pdf){openPdf(b.dataset.pdf);return}menu.hidden=true;bar.hidden=false;document.querySelectorAll('iframe').forEach(f=>f.hidden=f.id!=='f'+b.dataset.q);});
document.getElementById('back').onclick=()=>{document.querySelectorAll('iframe').forEach(f=>f.hidden=true);bar.hidden=true;menu.hidden=false;window.scrollTo(0,0)};
</script><script id="nav">
(function(){const show=id=>{document.querySelectorAll('.sec').forEach(x=>x.hidden=x.id!==id);window.scrollTo(0,0);try{sessionStorage.setItem('sec',id)}catch(e){}};
document.querySelectorAll('.big').forEach(b=>b.addEventListener('click',()=>show('sec'+b.dataset.sec)));
document.querySelectorAll('.backhome').forEach(b=>b.addEventListener('click',()=>show('home')));
try{const k=sessionStorage.getItem('sec');if(k&&document.getElementById(k))show(k)}catch(e){}})();
</script></body></html>
